schemaVersion: 1.0
workbook:
  fileName: cbs_rmt [02.15.02].xls
  sha256: REVIEW_REQUIRED
  inspectionReport: artifacts/workbook-inspection.json
  status: REVIEW_REQUIRED
  approvedBy: null
  approvedAt: null
  approvalNote: null

sheets:
  - sheetName: REVIEW_REQUIRED
    headerRow: 1
    status: REVIEW_REQUIRED
    candidateEntity: null
    keyColumns: []
    columns: []

# Canonical mapping is intentionally blocked while status is REVIEW_REQUIRED.
# Approval is checksum-bound to the exact workbook and inspection report.
# After inspection, every approved sheet must identify its source headers and
# each mapped column must declare its target, transform, required/null policy,
# and provenance handling.
#
# Example reviewed mapping:
# workbook:
#   status: APPROVED
#   approvedBy: reviewer-name
#   approvedAt: 2026-09-10T18:00:00-05:00
#   approvalNote: Reviewed against workbook inspection report.
#
# sheets:
#   - sheetName: Episodes
#     headerRow: 1
#     status: APPROVED
#     candidateEntity: episode
#     keyColumns: [SHOW #]
#     columns:
#       - sourceHeader: SHOW #
#         target:
#           entity: episode
#           field: canonical_number
#         transform: integer
#         required: true
#         provenance: preserve_raw_and_normalized
