openapi: 3.1.0
info:
  title: CBS Radio Mystery Theater API
  version: 2.0.0-foundation
  description: >-
    Contract-first API for the normalized CBS Radio Mystery Theater catalog.
    This contract supersedes the legacy user-centric Swagger definitions while
    preserving them as historical artifacts.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.invalid
    description: Placeholder production host; replace before release.
tags:
  - name: System
  - name: Episodes
  - name: People
  - name: Writers
  - name: Genres
  - name: Search
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API availability
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /episodes:
    get:
      tags: [Episodes]
      operationId: listEpisodes
      summary: List episodes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: episode_number
          in: query
          schema:
            type: integer
            minimum: 1
        - name: title
          in: query
          description: Case-insensitive title contains filter.
          schema:
            type: string
        - name: original_air_date_from
          in: query
          schema:
            type: string
            format: date
        - name: original_air_date_to
          in: query
          schema:
            type: string
            format: date
        - name: genre
          in: query
          description: Filter by canonical genre name.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MetadataStatus'
        - name: sort
          in: query
          description: Sort expression. Prefix with '-' for descending order.
          schema:
            type: string
            enum: [episode_number, -episode_number, title, -title, original_air_date, -original_air_date]
            default: episode_number
      responses:
        '200':
          description: Page of episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /episodes/{episodeId}:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [Episodes]
      operationId: getEpisode
      summary: Get one episode with catalog relationships
      responses:
        '200':
          description: Episode detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /people:
    get:
      tags: [People]
      operationId: listPeople
      summary: List people credited in the catalog
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: name
          in: query
          description: Case-insensitive canonical-name or alias filter.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [canonical_name, -canonical_name, sort_name, -sort_name]
            default: sort_name
      responses:
        '200':
          description: Page of people.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /people/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [People]
      operationId: getPerson
      summary: Get one person and known aliases
      responses:
        '200':
          description: Person detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /writers:
    get:
      tags: [Writers]
      operationId: listWriters
      summary: List people who have writing credits
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of writers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /writers/{writerId}:
    parameters:
      - name: writerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Writers]
      operationId: getWriter
      summary: Get one writer and writing credits
      responses:
        '200':
          description: Writer detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriterDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /genres:
    get:
      tags: [Genres]
      operationId: listGenres
      summary: List canonical genres
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of genres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenrePage'
  /genres/{genreId}:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Genres]
      operationId: getGenre
      summary: Get one genre
      responses:
        '200':
          description: Genre detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '404':
          $ref: '#/components/responses/NotFound'
  /search:
    get:
      tags: [Search]
      operationId: searchCatalog
      summary: Search episodes and people
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [episode, person]
            default: [episode, person]
          style: form
          explode: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Search result page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request parameters are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MetadataStatus:
      type: string
      enum: [confirmed, reported, disputed, unknown, derived]
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    EpisodeSummary:
      type: object
      additionalProperties: false
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        episode_number:
          type: [integer, 'null']
          minimum: 1
        title:
          type: string
          minLength: 1
        original_air_date:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/MetadataStatus'
    EpisodeDetail:
      allOf:
        - $ref: '#/components/schemas/EpisodeSummary'
        - type: object
          additionalProperties: false
          properties:
            synopsis:
              type: [string, 'null']
            duration_seconds:
              type: [integer, 'null']
              minimum: 1
            production_code:
              type: [string, 'null']
            notes:
              type: [string, 'null']
            cast:
              type: array
              items:
                $ref: '#/components/schemas/CastCredit'
            writers:
              type: array
              items:
                $ref: '#/components/schemas/WriterCredit'
            genres:
              type: array
              items:
                $ref: '#/components/schemas/Genre'
            broadcasts:
              type: array
              items:
                $ref: '#/components/schemas/Broadcast'
    EpisodePage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, canonical_name, status]
      properties:
        id:
          type: string
          format: uuid
        canonical_name:
          type: string
          minLength: 1
        sort_name:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/MetadataStatus'
    PersonAlias:
      type: object
      additionalProperties: false
      required: [id, name, alias_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        alias_type:
          type: string
    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          properties:
            notes:
              type: [string, 'null']
            aliases:
              type: array
              items:
                $ref: '#/components/schemas/PersonAlias'
            cast_credits:
              type: array
              items:
                $ref: '#/components/schemas/EpisodeCreditReference'
            writing_credits:
              type: array
              items:
                $ref: '#/components/schemas/EpisodeCreditReference'
    PersonPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CastCredit:
      type: object
      additionalProperties: false
      required: [id, person, status]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonSummary'
        character_name:
          type: [string, 'null']
        credit_order:
          type: [integer, 'null']
          minimum: 0
        status:
          $ref: '#/components/schemas/MetadataStatus'
    WriterCredit:
      type: object
      additionalProperties: false
      required: [id, person, credit_type, status]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonSummary'
        credit_type:
          type: string
        credit_order:
          type: [integer, 'null']
          minimum: 0
        status:
          $ref: '#/components/schemas/MetadataStatus'
    EpisodeCreditReference:
      type: object
      additionalProperties: false
      required: [episode]
      properties:
        episode:
          $ref: '#/components/schemas/EpisodeSummary'
        role:
          type: [string, 'null']
        credit_type:
          type: [string, 'null']
    WriterDetail:
      allOf:
        - $ref: '#/components/schemas/PersonDetail'
    Genre:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/MetadataStatus'
    GenrePage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Broadcast:
      type: object
      additionalProperties: false
      required: [id, date_precision, broadcast_type, status]
      properties:
        id:
          type: string
          format: uuid
        broadcast_date:
          type: [string, 'null']
          format: date
        date_precision:
          type: string
          enum: [day, month, year, unknown]
        broadcast_type:
          type: string
        station_or_network:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/MetadataStatus'
    SearchResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, episode]
          properties:
            type:
              const: episode
            episode:
              $ref: '#/components/schemas/EpisodeSummary'
        - type: object
          additionalProperties: false
          required: [type, person]
          properties:
            type:
              const: person
            person:
              $ref: '#/components/schemas/PersonSummary'
      discriminator:
        propertyName: type
    SearchPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
