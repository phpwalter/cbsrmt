name: test

on:
  push:
    branches:
      - foundation
  pull_request:
    branches:
      - main
      - foundation

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cbsrmt
          POSTGRES_PASSWORD: cbsrmt
          POSTGRES_DB: cbsrmt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbsrmt -d cbsrmt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cbsrmt:cbsrmt@localhost:5432/cbsrmt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: |
          for migration in db/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Validate historical source
        run: python tools/import_1982.py --validate-only

      - name: Import historical source
        run: python tools/import_1982.py

      - name: Re-import historical source
        run: python tools/import_1982.py

      - name: Run Python tests
        run: pytest -q

      - name: Run database reconciliation tests
        run: |
          for test_sql in db/tests/*.sql; do
            echo "Running $test_sql"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test_sql"
          done
