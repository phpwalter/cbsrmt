name: test

on:
  push:
    branches:
      - foundation
  pull_request:
    branches:
      - main
      - foundation

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cbsrmt
          POSTGRES_PASSWORD: cbsrmt
          POSTGRES_DB: cbsrmt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbsrmt -d cbsrmt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cbsrmt:cbsrmt@localhost:5432/cbsrmt
      API_DATABASE_URL: postgresql://cbsrmt_api_login:cbsrmt_api@localhost:5432/cbsrmt
      CBSRMT_REQUIRED_DB_ROLE: cbsrmt_api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations through ledger
        run: python tools/migrate.py

      - name: Verify migration checksums
        run: python tools/migrate.py

      - name: Provision restricted API login
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cbsrmt_api_login') THEN
                  CREATE ROLE cbsrmt_api_login LOGIN PASSWORD 'cbsrmt_api';
              END IF;
          END $$;
          GRANT cbsrmt_api TO cbsrmt_api_login;
          SQL

      - name: Validate historical source strictly
        run: python tools/import_1982.py --validate-only

      - name: Import historical source through quality pipeline
        run: python tools/import_1982_quality.py

      - name: Re-import historical source through quality pipeline
        run: python tools/import_1982_quality.py

      - name: Verify quality pipeline is clean for repository source
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              accepted integer;
              rejected integer;
              open_issues integer;
              quarantine_count integer;
          BEGIN
              SELECT rows_accepted, rows_rejected
              INTO accepted, rejected
              FROM provenance.import_batches
              ORDER BY started_at DESC
              LIMIT 1;

              SELECT count(*) INTO open_issues
              FROM quality.issues
              WHERE resolution_status = 'open';

              SELECT count(*) INTO quarantine_count
              FROM quality.quarantine
              WHERE resolution_status = 'open';

              IF accepted <> 127 THEN
                  RAISE EXCEPTION 'Expected 127 accepted rows, found %', accepted;
              END IF;
              IF rejected <> 0 THEN
                  RAISE EXCEPTION 'Expected 0 rejected rows, found %', rejected;
              END IF;
              IF open_issues <> 0 THEN
                  RAISE EXCEPTION 'Expected 0 open quality issues, found %', open_issues;
              END IF;
              IF quarantine_count <> 0 THEN
                  RAISE EXCEPTION 'Expected 0 quarantined rows, found %', quarantine_count;
              END IF;
          END $$;
          SQL

      - name: Verify restricted runtime access
        run: |
          psql "$API_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM api.runtime_access_check();
          SELECT count(*) FROM api.episodes;
          SQL

      - name: Run Python tests
        run: pytest -q

      - name: Run database reconciliation tests
        run: |
          for test_sql in db/tests/*.sql; do
            echo "Running $test_sql"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test_sql"
          done

      - name: Verify OpenAPI contract
        run: python tools/verify_openapi.py

      - name: Run reconciliation report
        run: python tools/reconcile.py

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start local stack
        run: docker compose up --build -d

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1

      - name: Verify seeded catalog through HTTP
        run: |
          curl --fail --silent "http://localhost:8000/episodes?showNumber=1273" | grep 'The Acquisition'
          curl --fail --silent "http://localhost:8000/broadcasts?otrwNumber=2711" | grep '1982-01-04'

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Tear down stack
        if: always()
        run: docker compose down -v
